[workspace]

[package]
name = "harness-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop shell for the local harness."

[lib]
name = "harness_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["voice"]
# Push-to-talk: microphone capture and on-device Whisper. whisper.cpp needs `cmake` to
# build (`brew install cmake`); `--no-default-features` builds the app without voice.
voice = ["dep:cpal", "dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
harness-core = { path = "../../crates/harness-core" }
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
cpal = { version = "0.18", optional = true }
whisper-rs = { version = "0.16", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metal for Whisper on Apple silicon.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
