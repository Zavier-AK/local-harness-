# The fleet.
#
# Isolation is per-role on purpose: builders get their own worktree, evaluators and
# testers are read-only, and anything that must work in the repo proper uses `shared`,
# which the engine serializes so two such workers cannot clobber each other.
#
# Cost shape: Claude is the planner and the escalation path, not the router. Frequent
# and cheap work goes to local models, which have no rate limit and no context floor.
#
# Roles can be reassigned while a session runs — "Change fleet" in the worker rail, or
# by editing this file. A role that needs a filesystem (worktree/readonly/shared) can
# move between the Claude and Codex CLIs, including onto a local model under Codex; a
# role with isolation = "none" can only take an openai_compat endpoint, since it has no
# tool loop. Changes apply to the next delegation: workers are spawned per delegation,
# so nothing is restarted and in-flight workers finish on the backend they started with.

default_role = "builder"

# ---------------------------------------------------------------------------
# Worktree bootstrap.
#
# `git worktree add` checks out tracked files and nothing else — no .env, no
# node_modules, no build output. A builder told to "run the tests" in a tree
# like that fails on its first command, so declare here whatever the project
# needs before work can start. Both lists are optional and empty by default.
#
#   copy  — gitignored files to bring in from the project root. Copied, never
#           symlinked: a symlinked .env means a worker editing it rewrites the
#           real one. Entries that do not exist are skipped.
#   setup — shell commands run in the worktree, in order, after `copy`.
#           Install dependencies here. Do NOT symlink node_modules from the
#           project root; bundlers reject module paths outside the tree.
#
# Each command gets `timeout_secs` (default 600) so a command that stops to ask
# a question cannot hang the worker forever. A failing command fails the worker
# and the half-built worktree is torn down.
#
# Two builders both running `npm run dev` will fight over the same port; give
# per-worktree ports if your setup starts long-running servers.
# ---------------------------------------------------------------------------

[worktree]
copy  = [".env", ".env.local"]
setup = []
# setup = ["npm ci"]
# timeout_secs = 600

# ---------------------------------------------------------------------------
# Verification before merge.
#
# Every proposed merge is checked before it reaches you, in a fresh checkout of
# exactly what would land. Its card then carries a low / medium / high risk
# level and the reasons for it.
#
#   commands     — the project's own checks, run in order. A failure makes the
#                  change high risk and its output is shown on the card.
#   reviewer     — a role that reviews the diff and returns a verdict. Cheap is
#                  ideal: a local model costs nothing. Must be readonly or none.
#   escalate_to  — a second, stronger reviewer, asked only when the first
#                  calls the change medium or high risk. Its verdict wins.
#
# With nothing set, only the free checks run (size, sensitive paths, deletions,
# code changed without tests) and the change is shown as *unverified* — never
# as safe just because nothing looked at it.
# ---------------------------------------------------------------------------

[verify]
commands = []
# commands     = ["cargo test", "npm test"]
# reviewer     = "tester"
# escalate_to  = "architect"
# timeout_secs = 900

# ---------------------------------------------------------------------------
# Claude Pro — rare, high-value calls.
# ---------------------------------------------------------------------------

[roles.architect]
provider  = "claude"
model     = "opus"
isolation = "readonly"
tools     = ["Read", "Grep", "Glob"]
brief     = "Break a problem into delegatable units and identify risks. Do not write code."
max_turns = 30

[roles.builder]
provider        = "claude"
model           = "sonnet"
isolation       = "worktree"
tools           = ["Read", "Edit", "Write", "Bash", "Grep", "Glob"]
permission_mode = "acceptEdits"
brief           = "Implement the change in your worktree. Run the project's tests before reporting done."
fallback_role   = "local_builder"
max_turns       = 60

# ---------------------------------------------------------------------------
# ChatGPT Plus — the second opinion, and the host for local models.
# ---------------------------------------------------------------------------

[roles.reviewer]
provider  = "codex"
isolation = "readonly"
tools     = ["Read", "Bash"]
brief     = "Review the change for correctness and risk. Report findings; do not fix them."
max_turns = 30

# ---------------------------------------------------------------------------
# Local — free, unlimited, and no subscription quota.
#
# `local` works today over plain chat completions: no tools, no filesystem,
# so it summarizes, classifies, drafts and gives second opinions.
#
# The two `codex` roles below are the same model with a real agent loop —
# tools, sandboxing, its own worktree — which Codex supplies for free. They
# need the Codex CLI installed; until then they report unavailable and the
# orchestrator is told not to reach for them.
#
# `lmstudio` and `ollama` are Codex built-ins pointing at :1234 and :11434
# respectively. A server on another machine needs its own provider id — see
# the block further down.
#
# NOTE: `model` must match what the server reports. Check with:
#   curl -s http://localhost:1234/v1/models | python3 -m json.tool
# An embedding model in that list (nomic-embed-text and friends) cannot serve
# as a worker — it has no chat completion endpoint.
# ---------------------------------------------------------------------------

[roles.local]
provider  = "openai_compat"
base_url  = "http://localhost:1234/v1"
model     = "qwen/qwen3-coder-30b"
isolation = "none"
brief     = "Answer concisely and concretely. No preamble."

[roles.local_builder]
provider      = "codex"
model         = "qwen/qwen3-coder-30b"
isolation     = "worktree"
tools         = ["Read", "Edit", "Write", "Bash"]
brief         = "Implement the change in your worktree. Keep it minimal."
provider_opts = { model_provider = "lmstudio" }
# Deliberately low: local inference is slow and heavy on the host, so a runaway
# loop costs real time on the machine rather than tokens. Raise once trusted.
max_turns     = 15

[roles.tester]
provider      = "codex"
model         = "qwen/qwen3-coder-30b"
isolation     = "readonly"
tools         = ["Read", "Bash"]
brief         = "Run the tests and report exactly what failed. Do not fix anything."
provider_opts = { model_provider = "lmstudio" }
max_turns     = 10

# Same shape as `local`, for an Ollama server instead of LM Studio.
# [roles.ollama_local]
# provider  = "openai_compat"
# base_url  = "http://localhost:11434/v1"
# model     = "gemma4:12b"
# isolation = "none"
# brief     = "Summarize what you are given. Be terse and concrete."

# ---------------------------------------------------------------------------
# A model server on another machine.
#
# Both `provider` choices below reach the same server; they differ in what the
# worker can do once it gets there.
#
#   openai_compat — plain chat completions. No tools, no filesystem. Right for
#                   summarize / classify / draft / second-opinion work.
#
#   codex         — a real agent loop with tools and sandboxing, for free.
#                   Needs a matching provider block in ~/.codex/config.toml:
#
#                     [model_providers.bionic]
#                     name = "bionic"
#                     base_url = "http://bionic.local:11434/v1"
#                     wire_api = "chat"
#
#                   The id must NOT be `ollama` or `lmstudio` — Codex reserves
#                   those for its built-ins and refuses to let them be
#                   overridden, so a remote server needs its own name.
#
# `base_url` on a codex role is not passed to the CLI; it tells the harness
# where to health-check, so a reachable remote server is not reported as down.
# ---------------------------------------------------------------------------

# [roles.remote_summarizer]
# provider  = "openai_compat"
# base_url  = "http://bionic.local:11434/v1"
# model     = "qwen3.6:35b-a3b"
# isolation = "none"
# brief     = "Summarize what you are given. Be terse and concrete."

# [roles.remote_builder]
# provider      = "codex"
# model         = "qwen/qwen3-coder-30b"
# isolation     = "worktree"
# tools         = ["Read", "Edit", "Write", "Bash"]
# base_url      = "http://bionic.local:11434/v1"   # health check only
# provider_opts = { model_provider = "bionic" }
# brief         = "Implement the change in your worktree. Keep it minimal."
# max_turns     = 60

# ---------------------------------------------------------------------------
# Deterministic stand-in for tests and dry runs. No network, no subscription.
# ---------------------------------------------------------------------------

[roles.mock]
provider  = "mock"
isolation = "worktree"
tools     = ["Read", "Write"]
