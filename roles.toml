# The fleet.
#
# Isolation is per-role on purpose: builders get their own worktree, evaluators and
# testers are read-only, and anything that must work in the repo proper uses `shared`,
# which the engine serializes so two such workers cannot clobber each other.
#
# Cost shape: Claude is the planner and the escalation path, not the router. Frequent
# and cheap work goes to local models, which have no rate limit and no context floor.

default_role = "builder"

# ---------------------------------------------------------------------------
# Claude Pro — rare, high-value calls.
# ---------------------------------------------------------------------------

[roles.architect]
provider  = "claude"
model     = "opus"
isolation = "readonly"
tools     = ["Read", "Grep", "Glob"]
brief     = "Break a problem into delegatable units and identify risks. Do not write code."
max_turns = 30

[roles.builder]
provider        = "claude"
model           = "sonnet"
isolation       = "worktree"
tools           = ["Read", "Edit", "Write", "Bash", "Grep", "Glob"]
permission_mode = "acceptEdits"
brief           = "Implement the change in your worktree. Run the project's tests before reporting done."
fallback_role   = "local_builder"
max_turns       = 60

# ---------------------------------------------------------------------------
# ChatGPT Plus — the second opinion, and the host for local models.
# ---------------------------------------------------------------------------

[roles.reviewer]
provider  = "codex"
isolation = "readonly"
tools     = ["Read", "Bash"]
brief     = "Review the change for correctness and risk. Report findings; do not fix them."
max_turns = 30

# ---------------------------------------------------------------------------
# Local — free, unlimited, and no subscription quota.
#
# `local` works today over plain chat completions: no tools, no filesystem,
# so it summarizes, classifies, drafts and gives second opinions.
#
# The two `codex` roles below are the same model with a real agent loop —
# tools, sandboxing, its own worktree — which Codex supplies for free. They
# need the Codex CLI installed; until then they report unavailable and the
# orchestrator is told not to reach for them.
#
# `lmstudio` and `ollama` are Codex built-ins pointing at :1234 and :11434
# respectively. A server on another machine needs its own provider id — see
# the block further down.
#
# NOTE: `model` must match what the server reports. Check with:
#   curl -s http://localhost:1234/v1/models | python3 -m json.tool
# ---------------------------------------------------------------------------

[roles.local]
provider  = "openai_compat"
base_url  = "http://localhost:1234/v1"
model     = "qwen3.6-35b-a3b"
isolation = "none"
brief     = "Answer concisely and concretely. No preamble."

[roles.local_builder]
provider      = "codex"
model         = "qwen3.6:35b-a3b"
isolation     = "worktree"
tools         = ["Read", "Edit", "Write", "Bash"]
brief         = "Implement the change in your worktree. Keep it minimal."
provider_opts = { model_provider = "lmstudio" }
max_turns     = 60

[roles.tester]
provider      = "codex"
model         = "qwen3.6:35b-a3b"
isolation     = "readonly"
tools         = ["Read", "Bash"]
brief         = "Run the tests and report exactly what failed. Do not fix anything."
provider_opts = { model_provider = "lmstudio" }
max_turns     = 30

# Same shape as `local`, for an Ollama server instead of LM Studio.
# [roles.ollama_local]
# provider  = "openai_compat"
# base_url  = "http://localhost:11434/v1"
# model     = "gemma4:12b"
# isolation = "none"
# brief     = "Summarize what you are given. Be terse and concrete."

# ---------------------------------------------------------------------------
# A model server on another machine.
#
# Both `provider` choices below reach the same server; they differ in what the
# worker can do once it gets there.
#
#   openai_compat — plain chat completions. No tools, no filesystem. Right for
#                   summarize / classify / draft / second-opinion work.
#
#   codex         — a real agent loop with tools and sandboxing, for free.
#                   Needs a matching provider block in ~/.codex/config.toml:
#
#                     [model_providers.bionic]
#                     name = "bionic"
#                     base_url = "http://bionic.local:11434/v1"
#                     wire_api = "chat"
#
#                   The id must NOT be `ollama` or `lmstudio` — Codex reserves
#                   those for its built-ins and refuses to let them be
#                   overridden, so a remote server needs its own name.
#
# `base_url` on a codex role is not passed to the CLI; it tells the harness
# where to health-check, so a reachable remote server is not reported as down.
# ---------------------------------------------------------------------------

# [roles.remote_summarizer]
# provider  = "openai_compat"
# base_url  = "http://bionic.local:11434/v1"
# model     = "qwen3.6:35b-a3b"
# isolation = "none"
# brief     = "Summarize what you are given. Be terse and concrete."

# [roles.remote_builder]
# provider      = "codex"
# model         = "qwen3.6:35b-a3b"
# isolation     = "worktree"
# tools         = ["Read", "Edit", "Write", "Bash"]
# base_url      = "http://bionic.local:11434/v1"   # health check only
# provider_opts = { model_provider = "bionic" }
# brief         = "Implement the change in your worktree. Keep it minimal."
# max_turns     = 60

# ---------------------------------------------------------------------------
# Deterministic stand-in for tests and dry runs. No network, no subscription.
# ---------------------------------------------------------------------------

[roles.mock]
provider  = "mock"
isolation = "worktree"
tools     = ["Read", "Write"]
