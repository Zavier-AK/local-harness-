# Labelled phrases for the voice commander, against `eval::fixture()`:
#   #1 builder   — done, a merge waiting (low risk)
#   #2 tester    — running
#   #3 reviewer  — a delegation waiting for approval
#   a draft plan, a running night shift, projects "shop" (open) and "blog", autonomy Review,
#   an earlier landing (w-old) that can be undone, and a dozen installed apps (Notes,
#   Safari, Visual Studio Code, Slack, Google Chrome, Cursor, Terminal, Finder, Microsoft
#   Word and Excel, LM Studio, System Settings).
#
# `expect` is the action and its key argument, as `eval::label` writes it; `to_head` means
# the words should go to the head agent. The unit tests require that the phrase matcher is
# never wrong on these — it may only be right or pass. `harness-cli voice --eval` runs them
# through Laya too and reports how often it is right, wrong, or unsure, and how fast.

# ---------------------------------------------------------------- status
[[phrase]]
said = "What's waiting for me?"
expect = "status waiting"
[[phrase]]
said = "anything I need to look at"
expect = "status waiting"
[[phrase]]
said = "status"
expect = "status overview"
[[phrase]]
said = "how are things going"
expect = "status overview"
[[phrase]]
said = "what's running right now"
expect = "status workers"
[[phrase]]
said = "who's busy at the moment"
expect = "status workers"
[[phrase]]
said = "How's the night shift going?"
expect = "status night"
[[phrase]]
said = "did the overnight run find anything"
expect = "status night"
[[phrase]]
said = "how far along is the plan"
expect = "status plan"
[[phrase]]
said = "how much of my usage is left"
expect = "status limits"

