[workspace]
members = ["crates/harness-core", "crates/harness-cli"]
# The Tauri app is its own workspace: it pulls a large, platform-specific dependency
# tree that would otherwise be built whenever the engine is tested.
exclude = ["app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
futures = "0.3"
rand = "0.9"
